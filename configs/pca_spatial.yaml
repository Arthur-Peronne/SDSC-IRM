# configs/pca_spatial.yaml
# Parameters for run_pca_spatial.py
# Modify this file, then run: python scripts/run_pca_spatial.py
# MLflow archives this file as artifact at each run.

# ── Tracking ──────────────────────────────────────────────────────────────────
experiment_tag: "to_add"       # PCA has no hyperparameter regime — kept for symmetry with AE

# ── Data ──────────────────────────────────────────────────────────────────────
source_folder: "registered_frames"
cache_folder: "X_vectors"        # subfolder in processed_images/ for cached .npy arrays
n_train: 120
n_val: 0
n_test: 30
special_split: "split100"          # null = sequential "splitdefault" ; ex: "split42" for seeded random split
stratify_ongroup: true          # true = stratify on ACDC group when special_split is set
recalculate_x: false
use_both_frames: true            # true = ED+ES, false = use frame_type below
frame_type: "ED"                 # "ED" or "ES" — used only if use_both_frames = false

# ── PCA ───────────────────────────────────────────────────────────────────────
recalculate_pca: true
load_run_id: "" # MLflow run ID "" — required when recalculate_pca: false
image_roi_only: true
mask_ys: false                   # apply ground-truth mask
mask_bin: false                  # use binary mask
original_shape: [128, 128, 32]
max_pc_calc: 300

# ── Reconstruction metrics ────────────────────────────────────────────────────
compute_metrics: true
plot_metrics: true               # save R²/MSE vs n_PCs as PDF in results/
latdim_list_pca: null            # null = range(1, n_development); or explicit list e.g. [10, 20, 50]

# ── Plots : explained variance ────────────────────────────────────────────────
plot_explained_variance: true

# ── Plots : PC values in eigenbase ────────────────────────────────────────────
plot_pc_values: true
pc_max: 6                       # plots pairs (1,2), (3,4), ... up to pc_max — must be even
plot_metadata: true

# ── Plots : eigenvectors ──────────────────────────────────────────────────────
plot_eigenvectors: true         # slow — set true only when needed
eigenvectors_to_plot: [1,2]

# ── Plots : reconstruction ────────────────────────────────────────────────────
plot_reconstruction: false
n_pc_to_reconstruct: 10
recons_auto: false
patients_torecons_manual:
  - [1, "ED"]
  - [30, "ES"]
  - [110, "ED"]
  - [130, "ES"]
  - [145, "ED"]
