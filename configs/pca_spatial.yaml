# configs/pca_spatial.yaml
# Parameters for run_pca_spatial.py
# Modify this file, then run: python scripts/run_pca_spatial.py
# MLflow archives this file as artifact at each run.

# ── Tracking ──────────────────────────────────────────────────────────────────
experiment_tag: "baseline"       # PCA has no hyperparameter regime — kept for symmetry with AE

# ── Data ──────────────────────────────────────────────────────────────────────
source_folder: "registered_frames"
cache_folder: "X_vectors"        # subfolder in processed_images/ for cached .npy arrays
n_development: 120               # train + validation patients
n_validation: 0
splitname: "split0"
recalculate_x: true
use_both_frames: true            # true = ED+ES, false = use frame_type below
frame_type: "ED"                 # "ED" or "ES" — used only if use_both_frames = false

# ── PCA ───────────────────────────────────────────────────────────────────────
image_roi_only: true
mask_ys: false                   # apply ground-truth mask
mask_bin: false                  # use binary mask
original_shape: [128, 128, 32]
max_pc_calc: 300
recalculate_pca: true
load_run_id: null                # MLflow run ID — required when recalculate_pca: false

# ── Reconstruction metrics ────────────────────────────────────────────────────
compute_metrics: true
plot_metrics: true               # save R²/MSE vs n_PCs as PDF in results/
latdim_list_pca: null            # null = range(1, n_development); or explicit list e.g. [10, 20, 50]

# ── Standalone plots ──────────────────────────────────────────────────────────
plot_explained_variance: true
plot_pc_values: true
plot_metadata: false
plot_eigenvectors: false         # slow — set true only when needed
pc_max: 10                       # plots pairs (1,2), (3,4), ... up to pc_max — must be even
eigenvectors_to_plot: [1, 2, 3]

# ── Reconstruction plots ───────────────────────────────────────────────────────
plot_reconstruction: true
n_pc_to_reconstruct: 240
recons_auto: false
patients_torecons_manual:
  - [1, "ED"]
  - [30, "ES"]
  - [110, "ED"]
  - [130, "ES"]
  - [145, "ED"]
