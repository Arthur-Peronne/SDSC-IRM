# configs/autoencoder.yaml
# Parameters for run_autoencoder.py
# Modify this file, then run: python scripts/run_autoencoder.py
# MLflow archives this file as artifact at each run.

# ── Tracking ──────────────────────────────────────────────────────────────────
experiment_tag: "optuna"         # "baseline", "optuna", or any custom label

# ── Data ──────────────────────────────────────────────────────────────────────
use_both_frames: true            # true = ED+ES (x2 images), false = ED only
n_development: 120               # train + validation patients
n_validation: 0                  # 0 = no validation set (uses full n_development for train)
splitname: "split0"
recalculate_x: false             # recompute X vectors from nii files
imagesource: "registered_frames"

# ── Model ─────────────────────────────────────────────────────────────────────
model_name: "AE3dFCDeep"         # "AE3dFCDeep", "AE3dCurrent", "AE3dConv", "AE3dLinear"
latent_dimensions: 240
multiple_models_and_dims: false  # true = loop over models_list x latdim_list
models_list: ["AE3dFCDeep"]
latdim_list: [1, 2, 3, 4, 5, 7, 10, 15, 20, 30, 40, 60, 80, 100, 130, 160, 200, 240]

# ── Training ──────────────────────────────────────────────────────────────────
recalculate_ae: false            # false = load existing model
load_epoch: null                 # null = auto-detect; set to int to load a specific epoch
n_epochs: 75                     # max epochs (early stopping triggers earlier if n_validation > 0)
batch_size: 1
lr: 4.24e-5
weight_decay: 6.47e-6
dropout_rate: 0.221              # 0.0 for AE3dConv and AE3dLinear
noise_std: 0.002                 # 0.0 = no denoising
patience: 45                     # early stopping patience (used only if n_validation > 0)
patience_scheduler: null         # null = patience // 5

# ── Reconstruction plots ───────────────────────────────────────────────────────
plot_reconstruction: true
recons_auto: false               # true = auto-select good/medium/bad patients
patients_torecons_manual:        # used only if recons_auto = false
  - [1, "ED"]
  - [30, "ES"]
  - [110, "ED"]
  - [130, "ES"]
  - [145, "ED"]
