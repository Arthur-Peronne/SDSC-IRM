# configs/visualize_latent.yaml
# Parameters for run_visualize_latent.py
# Modify this file, then run: python scripts/run_visualize_latent.py

# ── Tracking ──────────────────────────────────────────────────────────────────
load_run_id: ff88455bd0a645ed8b1491b1d4bd39af  # MLflow run ID of the trained AE/VAE model

# ── Data ──────────────────────────────────────────────────────────────────────
use_both_frames: true            # true = ED+ES (300 points), false = ED only
n_patients: 150                  # total patients to visualize (all 150 by default)

# ── Model ─────────────────────────────────────────────────────────────────────
# model_name and latent_dimensions are read automatically from the MLflow run params

# ── Visualization ─────────────────────────────────────────────────────────────
projection: "pca"                # "pca" only for now
use_tsne: false                  # true = also compute t-SNE (slow) — not yet implemented
color_by: "group"                # "group" (ACDC classes) — extensible later