# configs/ae_HPforarchis.yaml
#
# Optuna-optimised hyperparameters per architecture and latent dim.
# Used by src/training/ae_hparam_loader.py when hyper_automatic_values: true
# in configs/autoencoder.yaml.
#
# Resolution rules (see ae_hparam_loader.py for full logic):
#   - Model present, 2+ dim entries  → log-interpolation to the requested dim
#                                       (no extrapolation: clamped to boundary dims)
#   - Model present, 1 dim entry     → that entry used for all dims
#   - Model absent                   → 'default' block used
#
# Interpolation scale per hyperparameter:
#   log-log   (Optuna log=True):  lr, weight_decay, beta
#   log-linear (Optuna log=False): dropout_rate, noise_std, patience, beta_warmup_epochs
#
# Hand-tuned fallback values go in the 'default' block below.
# ─────────────────────────────────────────────────────────────────────────────

