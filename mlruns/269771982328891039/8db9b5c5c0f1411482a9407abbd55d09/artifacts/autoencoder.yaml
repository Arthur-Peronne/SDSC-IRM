# configs/autoencoder.yaml
# Parameters for run_autoencoder.py
# Modify this file, then run: python scripts/run_autoencoder.py
# MLflow archives this file as artifact at each run.

# ── Tracking ──────────────────────────────────────────────────────────────────
experiment_tag: "optuna"       # "baseline", "optuna", or any custom label

# ── Data ──────────────────────────────────────────────────────────────────────
source_folder: "registered_frames"
use_both_frames: true            # true = ED+ES, false = use frame_type below
frame_type: "ED"                 # "ED" or "ES" — used only if use_both_frames = false
image_roi_only: true
mask_ys: false                   # apply ground-truth mask
mask_bin: false                  # use binary mask
recalculate_x: false
cache_folder: "X_vectors"        # subfolder in processed_images/ for cached .npy arrays

# ── Split ────────────────────────────────────────────────────────────────
n_train: 100
n_val: 20
n_test: 30
special_split: null              # null = sequential "splitdefault"; e.g. "split42" for seeded


# ── Model ─────────────────────────────────────────────────────────────────────
model_name: "AE3dConv"         # "AE3dFCDeep", "AE3dCurrent", "AE3dConv", "AE3dLinear", "AE3dFCDeep_VAE"
latent_dimensions: 40
multiple_models_and_dims: true  # true = loop over models_list × latdim_list
models_list: ["AE3dFCDeep", "AE3dCurrent", "AE3dConv"]
latdim_list: [4, 8, 12, 16, 20, 28, 40, 60, 88, 120, 160, 200, 240]

# ── Training ──────────────────────────────────────────────────────────────────
recalculate_ae: true             # false = load existing model (requires load_run_id)
load_run_id: null                # MLflow run ID — required when recalculate_ae: false
n_epochs: 500                    # max epochs (early stopping triggers earlier if n_val > 0)
batch_size: 1
lr: 1e-5
weight_decay: 6.47e-6              # L2 regularisation; optuna example: 6.47e-6
dropout_rate: 0.3221                # 0.0 for AE3dConv and AE3dLinear; optuna example: 0.221
noise_std: 0.002                   # 0.0 = no denoising; optuna example: 0.002
patience: 40                     # early stopping patience (used only if n_val > 0)
patience_scheduler: null         # null = patience // 5

# ── VAE parameters (AE3dFCDeep_VAE only) ──────────────────────────────────────
beta: 1.0                        # KL weight in VAE loss
beta_warmup_epochs: 20           # epochs to linearly ramp beta from 0 to target value

# ── Reconstruction metrics ────────────────────────────────────────────────────
compute_metrics: true
plot_metrics: true               # save R²/MSE vs latent dim as PDF in results/

# ── Plots : reconstruction ────────────────────────────────────────────────────
plot_reconstruction: false
recons_auto: false               # true = auto-select good/medium/bad patients (from val/test only)
patients_torecons_manual:
  - [1, "ED"]
  - [30, "ES"]
  - [110, "ED"]
  - [130, "ES"]
  - [145, "ED"]
